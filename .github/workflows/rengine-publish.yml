name: Publish rengine to Cloudsmith

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-rengine-cloudsmith
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'desertrat-io/numru' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rengine-package
      PACKAGE_DIR: ${{ runner.temp }}/numru-rengine
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the publishing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare numru-rengine package
        run: |
          # Cargo uses the manifest name as the registry package name.
          cp -R rengine "$PACKAGE_DIR"
          sed -i '' 's/^name = "rengine"$/name = "numru-rengine"/' "$PACKAGE_DIR/Cargo.toml"
          # Preserve the library name used by existing Rust imports.
          printf '\n[lib]\nname = "rengine"\n' >> "$PACKAGE_DIR/Cargo.toml"

      - name: Set up Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Reject the current Cloudsmith version
        run: |
          version=$(cargo metadata --manifest-path "$PACKAGE_DIR/Cargo.toml" --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "numru-rengine") | .version')
          latest_version=$(cloudsmith list packages desertrat-io/numru \
            --query 'format:cargo AND name:^numru-rengine$' --sort=-version --page-size 1 --output-format json \
            | jq -r '.data[0].version // empty')
          if [[ "$version" == "$latest_version" ]]; then
            echo "::error::numru-rengine $version is already the current version in Cloudsmith. Bump the crate version appropriately before deploying."
            exit 1
          fi

      - name: Package and verify the crate
        run: cargo package --manifest-path "$PACKAGE_DIR/Cargo.toml"

      - name: Publish crate to Cloudsmith
        run: cloudsmith push cargo desertrat-io/numru "$CARGO_TARGET_DIR"/package/numru-rengine-*.crate
