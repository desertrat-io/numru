name: Publish rengine to Cloudsmith

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "rengine/**"

permissions:
  contents: read

concurrency:
  group: publish-rengine-cloudsmith
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/rengine-package

    steps:
      - name: Check out the publishing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package and verify the crate
        run: cargo package --manifest-path rengine/Cargo.toml

      - name: Publish crate to Cloudsmith
        uses: cloudsmith-io/action@master
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        with:
          format: cargo
          owner: desertrat-io
          repo: numru
          file: ${{ env.CARGO_TARGET_DIR }}/package/rengine-*.crate
