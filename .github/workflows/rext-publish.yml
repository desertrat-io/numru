name: Publish rext to Cloudsmith

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-rext-cloudsmith
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow == 'Publish rext to Cloudsmith'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rext
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      NUMRU_GEM_PLATFORM: arm64-darwin-25
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      RB_SYS_CARGO_PROFILE: release
      # Avoid the Rust/macOS LINKEDIT alignment issue when stripping dylibs.
      CARGO_PROFILE_RELEASE_STRIP: none

    steps:
      - name: Check out the publishing revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Ruby and gem dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: rext

      - name: Verify the native build platform
        run: |
          test "$(uname -m)" = "arm64"
          test "$(uname -r | cut -d. -f1)" = "25"
          # Prebuilt Ruby may report an older Darwin version than the runner.
          ruby -e 'platform = Gem::Platform.local; abort "Expected ARM64 macOS Ruby, got #{platform}" unless platform.cpu == "arm64" && platform.os == "darwin"'

      - name: Build the compiled gem
        run: bundle exec rake native gem

      - name: Publish gem to Cloudsmith
        uses: cloudsmith-io/action@master
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        with:
          format: ruby
          owner: desertrat-io
          repo: numru
          file: rext/pkg/numru-rext-*-arm64-darwin-25.gem
